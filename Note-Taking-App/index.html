<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Taking App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Notes</h1>
            </div>
            <div class="sidebar-actions">
                <button id="newNoteBtn" class="btn btn-primary">+ New Note</button>
            </div>
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search notes..."
                    class="search-input"
                >
            </div>
            <ul id="notesList" class="notes-list"></ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Empty State -->
            <div id="emptyState" class="empty-state">
                <h2>No note selected</h2>
                <p>Create a new note or select one from the list</p>
            </div>

            <!-- Editor -->
            <div id="editor" class="editor hidden">
                <div class="editor-header">
                    <input 
                        type="text" 
                        id="noteTitle" 
                        placeholder="Note title..." 
                        class="note-title"
                    >
                    <div class="editor-actions">
                        <button id="saveBtn" class="btn btn-success">Save</button>
                        <button id="deleteBtn" class="btn btn-danger">Delete</button>
                    </div>
                </div>

                <div class="note-meta">
                    <span id="createdDate" class="meta-item"></span>
                    <span id="updatedDate" class="meta-item"></span>
                </div>

                <textarea 
                    id="noteContent" 
                    class="note-content" 
                    placeholder="Start typing..."></textarea>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
